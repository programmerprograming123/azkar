    <style>
        body {
            background-color: rgb(143, 199, 88);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            margin: 30px;
            padding: 0;
        }
        
        #headerDiv {
            background-color: rgb(34, 146, 67);
            display: grid;
            place-items: center;
            border-radius: 12px;
            margin: 10px;
            border: 1px solid black;
        }
        
        #headerDiv h1 {
            color: white;
        }
        /* Grid Container */
        
        #photosAndButtons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            justify-items: center;
            gap: 20px;
            padding: 20px;
        }
        /* General style for each card */
        
        #photosAndButtons>div {
            background-color: rgb(80, 114, 47);
            width: 220px;
            height: 275px;
            border-radius: 13px;
            border: 1px solid black;
            text-align: center;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        
        #photosAndButtons>div:hover {
            transform: scale(1.03);
        }
        
        #photosAndButtons img {
            width: 200px;
            height: 150px;
            margin-top: 10px;
            border-radius: 10px;
        }
        
        #photosAndButtons button {
            background-color: rgb(97, 138, 57);
            border: none;
            border-radius: 12px;
            width: 90%;
            height: 60px;
            margin-top: 10px;
            font-size: larger;
            cursor: pointer;
            color: white;
            transition: background-color 0.3s;
        }
        
        #photosAndButtons button:hover {
            background-color: rgb(110, 158, 65);
        }
        
        a {
            text-decoration: none;
        }
    </style>
</head>
