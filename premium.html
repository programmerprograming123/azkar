<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اذكار</title>
    <style>
        body {
            background-color: rgb(143, 199, 88);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            margin: 30px;
            padding: 0;
        }
        
        #headerDiv {
            background-color: rgb(34, 146, 67);
            color: white;
            display: grid;
            place-items: center;
            border-radius: 0 0 20px 20px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        #backBtn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 18px;
            font-family: 'Tajawal', sans-serif;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            z-index: 100;
            margin-top: 30px;
            margin-left: 30px;
        }
        
        #headerDiv h1 {
            color: white;
        }
        /* Grid Container */
        
        #photosAndButtons {
            display: grid;
            place-items: center;
        }
        /* General style for each card */
        
        #photosAndButtons>div {
            background-color: rgb(80, 114, 47);
            width: 220px;
            height: 275px;
            border-radius: 13px;
            border: 1px solid black;
            text-align: center;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        
        #photosAndButtons>div:hover {
            transform: scale(1.03);
        }
        
        div #premium {
            border: rgb(43, 87, 37) 10px solid;
            height: auto;
            width: 800px;
            display: grid;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: x-large;
            margin-bottom: 10px;
            margin-top: 50px;
            color: rgb(38, 51, 23);
        }
        
        div #premium h5,
        h6 {
            margin: 15px;
        }
        
        div #premium a {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: large;
        }
        
        #backBtn:hover {
            background: linear-gradient(135deg, #388e3c, #81c784);
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        #backBtn:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div id="headerDiv">
        <header>
            <button id="backBtn" onclick="history.back()">⬅ العودة</button>
            <h1 id="HeadH1">Premium</h1>

        <div id="premium">

                                        <h6><strong>memorizing zikr ❌</strong></h2>
                                            <h6><strong>Voiced Zikr ❌</strong></h2>
                                                <h6><strong>For free </strong></h2>




        </div>

</body>

</html>
